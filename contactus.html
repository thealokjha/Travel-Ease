<!DOCTYPE html>
<header>
    <h1>
        CONTACT US 
    </h1>
</header>

<body>
    
    <form>

        <label for="fname">First Name </label><br>
        <input type="text" id="fname" name="fname" required><br>

        <label for="lname"> Last Name </label><br>
        <input type="text" id="lname" name="lname"><br>

        <label for="email">Enter your Gmail </label><br>
        <input type="email" id="email" name="email"  placeholder="yourname@example.com" required><br>

        <label for="phone">Enter your phone number </label><br>
        <input type="tel" id="tel" name="phone" placeholder="9876543210"  pattern="d{9}" required><br>

        <label for="message">Enter your message</label><br>
        <input type="text" id="message" name="message"><br>

        <button type="submit">Submit</button>
    </form>
</body>
